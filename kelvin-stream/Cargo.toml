[package]
name = "kelvin-stream"
version = "0.1.0"
edition = "2021"
description = "Stream cipher integration for Kelvin cryptosystem"
license = "CC-BY-NC-SA-4.0"

[lib]
name = "kelvin_stream"
path = "src/lib.rs"

[dependencies]
aes = { version = "0.9.0", optional = true }
chacha20 = "0.9"
ctr = { version = "0.10.0", optional = true }
zeroize = { version = "1.6", features = ["zeroize_derive"] }

[features]
aes = ["dep:aes"]
ctr = ["dep:ctr"]
aes-ni = ["dep:aes", "dep:ctr"]
