[package]
name = "kelvin-stream"
version = "0.1.0"
edition = "2021"
description = "Stream cipher integration for Kelvin cryptosystem"
license = "CC-BY-NC-SA-4.0"

[lib]
name = "kelvin_stream"
path = "src/lib.rs"

[dependencies]
chacha20 = "0.9"
zeroize = { version = "1.6", features = ["zeroize_derive"] }
