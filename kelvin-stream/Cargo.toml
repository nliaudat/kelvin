[package]
name = "kelvin-stream"
version = "0.1.0"
edition = "2021"
description = "Stream cipher integration for Kelvin cryptosystem"
license = "MIT OR Apache-2.0"

[lib]
name = "kelvin_stream"
path = "src/lib.rs"

[dependencies]
chacha20 = "0.9"
chacha20poly1305 = "0.10"
aead = "0.5"
aes = { version = "0.9.0", optional = true }
aes-gcm = { version = "0.10", optional = true }
ctr = { version = "0.10.0", optional = true }
zeroize = { version = "1.6", features = ["zeroize_derive"] }

[features]
aes = ["dep:aes", "dep:aes-gcm"]
ctr = ["dep:ctr"]
aes-ni = ["dep:aes", "dep:aes-gcm", "dep:ctr"]
