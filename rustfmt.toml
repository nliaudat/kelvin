# ==============================================================================
# Kelvin Rustfmt Configuration
# ==============================================================================
# Academic code formatting rules for consistency and readability.
# See: https://rust-lang.github.io/rustfmt/
#
# NOTE: Only stable options are used here. Nightly-only options like
# imports_granularity, group_imports, wrap_comments, etc. are intentionally
# omitted so that `cargo fmt` works identically on stable Rust.

# Maximum line width (standard academic paper column width)
max_width = 100

# Indentation
tab_spaces = 4
hard_tabs = false

# Imports
reorder_imports = true

# Types
use_small_heuristics = "Max"
merge_derives = true

# Match arms
match_block_trailing_comma = true

# Newline style
newline_style = "Auto"
