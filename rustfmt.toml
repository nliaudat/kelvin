# ==============================================================================
# Kelvin Rustfmt Configuration
# ==============================================================================
# Academic code formatting rules for consistency and readability.
# See: https://rust-lang.github.io/rustfmt/

# Maximum line width (standard academic paper column width)
max_width = 100

# Indentation
tab_spaces = 4
hard_tabs = false

# Imports
imports_granularity = "Module"
reorder_imports = true
group_imports = "StdExternalCrate"

# Comments
wrap_comments = true
format_code_in_doc_comments = true
comment_width = 100
normalize_comments = true

# Types
use_small_heuristics = "Max"
merge_derives = true

# Match arms
match_block_trailing_comma = true

# Where clauses
where_single_line = false

# Newline style
newline_style = "Auto"
