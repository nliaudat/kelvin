[package]
name = "kelvin-test-client"
version = "0.1.0"
edition = "2021"
description = "Test vector client for Kelvin cryptosystem — verifies determinism against server golden files"
license = "CC-BY-NC-SA-4.0"

[[bin]]
name = "kelvin-test-client"
path = "src/main.rs"

[dependencies]
kelvin = { path = "../kelvin", features = ["serde"] }
kelvin-core = { path = "../kelvin-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
