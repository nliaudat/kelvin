{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ─── Configuration ────────────────────────────────────────────────────────
const CONFIG = {
  G: 39.47841760435743,  // 4π² in AU³/(M☉·yr²)
  dt: 0.0009765625,      // Time step (years) ≈ 8.76 hours — matches DEFAULT_DT
  softening: 1e-6,       // Softening factor (AU)
  trailLength: 200,      // Orbital trail history length
  keyInterval: 10000,    // Key generation interval (steps)
  collapseThreshold: 1e-12, // Min separation (AU) before collapse detection
};

// Speed presets: [label, stepsPerFrame]
const SPEED_PRESETS = [
  [1,    1],
  [10,   10],
  [50,   50],
  [100,  100],
  [250,  250],
];

// ─── Default Initial Conditions (1 sun + 8 planets = 9 bodies) ────────────
// All planets have significant z-components to produce true 3D trajectories.
// Sizes are computed dynamically from mass in buildBodies().
function createDefaultBodies() {
  return [
    { mass: 1.0,   pos: [0, 0, 0],          vel: [0, 0, 0],            name: '☀ Kuna\'s Eye',  color: 0xffaa00 },
    { mass: 1e-6,  pos: [1.0, 0.3, 0.5],    vel: [0, 4.5, 3.0],        name: '🟠 Tatooine',     color: 0x4488ff },
    { mass: 5e-7,  pos: [0, 1.8, -0.8],      vel: [-3.5, 0, 2.5],       name: '🟢 Naboo',        color: 0x44ff88 },
    { mass: 3e-7,  pos: [-1.2, -0.6, 1.0],   vel: [2.0, -4.0, -1.5],    name: '🔴 Aargau',       color: 0xff4444 },
    { mass: 2e-7,  pos: [0.8, -1.5, -0.7],   vel: [3.0, 1.5, -3.0],     name: '🟣 Alderaan',     color: 0xaa44ff },
    { mass: 1.5e-7, pos: [-0.5, 2.2, 0.9],   vel: [-2.5, -1.0, -2.0],   name: '🟡 Bespin',       color: 0xffdd44 },
    { mass: 1e-7,  pos: [2.0, -0.8, -0.5],   vel: [-1.5, 3.0, 1.8],     name: '🔵 Corellia',     color: 0x4488ff },
    { mass: 8e-8,  pos: [-1.8, -1.2, -1.0],  vel: [2.0, 1.5, -2.5],     name: '🟤 Dantooine',    color: 0xaa8844 },
    { mass: 5e-8,  pos: [0.3, -2.5, 1.2],    vel: [-3.0, 0.5, 1.5],     name: '⚪ Endor',        color: 0xcccccc },
  ];
}

// ─── Parse key.json (OrbitalConfig format) ────────────────────────────────
function parseOrbitalConfig(json) {
  // Expected format (matches kelvin-kdf OrbitalConfig serde):
  // {
  //   "bodies": [
  //     { "mass": <i128>, "position": { "x": <i128>, "y": <i128>, "z": <i128> },
  //       "velocity": { "x": <i128>, "y": <i128>, "z": <i128> } },
  //     ...
  //   ],
  //   "total_steps": <u64>,
  //   "reseed_interval": <u64>,
  //   "dt": <i128>,
  //   "softening": <i128>,
  //   "g": <i128>
  // }
  //
  // i128 values are Q32.64 fixed-point raw values.
  // We also support a simpler format with plain floats for demo purposes.

  const data = typeof json === 'string' ? JSON.parse(json) : json;

  // Convert from Q32.64 fixed-point raw value to float
  function fromRaw(raw) {
    return Number(BigInt(raw)) / 0x1_0000_0000_0000_0000;
  }

  const bodies = data.bodies.map((b, idx) => {
    let mass, pos, vel, name, color;

    if (b.mass_raw !== undefined) {
      // Raw Q32.64 format
      mass = fromRaw(b.mass_raw);
      pos = [fromRaw(b.position_raw?.x ?? 0), fromRaw(b.position_raw?.y ?? 0), fromRaw(b.position_raw?.z ?? 0)];
      vel = [fromRaw(b.velocity_raw?.x ?? 0), fromRaw(b.velocity_raw?.y ?? 0), fromRaw(b.velocity_raw?.z ?? 0)];
    } else if (b.mass !== undefined && typeof b.mass === 'object' && b.mass.raw !== undefined) {
      // { mass: { raw: <i128> }, position: { x: { raw: ... }, ... }, ... }
      mass = fromRaw(b.mass.raw);
      pos = [fromRaw(b.position?.x?.raw ?? 0), fromRaw(b.position?.y?.raw ?? 0), fromRaw(b.position?.z?.raw ?? 0)];
      vel = [fromRaw(b.velocity?.x?.raw ?? 0), fromRaw(b.velocity?.y?.raw ?? 0), fromRaw(b.velocity?.z?.raw ?? 0)];
    } else {
      // Plain float format (demo-friendly)
      mass = b.mass ?? 1e-6;
      pos = [b.position?.x ?? 0, b.position?.y ?? 0, b.position?.z ?? 0];
      vel = [b.velocity?.x ?? 0, b.velocity?.y ?? 0, b.velocity?.z ?? 0];
    }

    // Assign names and colors based on index
    const names = [
      '☀ Kuna\'s Eye', '☀ Ka\'Dedus',
      '🟠 Tatooine', '🟢 Naboo', '🔴 Aargau', '🟣 Alderaan',
      '🟡 Bespin', '🔵 Corellia', '🟤 Dantooine', '⚪ Endor',
      '🟢 Hoth', '🔴 Yavin',
    ];
    const colors = [
      0xffaa00, 0xff8800,
      0x4488ff, 0x44ff88, 0xff4444, 0xaa44ff,
      0xffdd44, 0x4488ff, 0xaa8844, 0xcccccc,
      0x88ff88, 0xff4444,
    ];

    return {
      mass,
      pos,
      vel,
      name: b.name || names[idx] || `🪐 Planet ${idx - 1}`,
      color: b.color !== undefined ? b.color : (colors[idx] || 0xffffff),
      // Size is computed dynamically from mass in buildBodies()
    };
  });

  // Parse simulation parameters
  let g = CONFIG.G;
  let dt = CONFIG.dt;
  let softening = CONFIG.softening;
  let totalSteps = undefined;

  if (data.g !== undefined) {
    g = typeof data.g === 'object' && data.g.raw !== undefined ? fromRaw(data.g.raw) : Number(data.g);
  }
  if (data.dt !== undefined) {
    dt = typeof data.dt === 'object' && data.dt.raw !== undefined ? fromRaw(data.dt.raw) : Number(data.dt);
  }
  if (data.softening !== undefined) {
    softening = typeof data.softening === 'object' && data.softening.raw !== undefined ? fromRaw(data.softening.raw) : Number(data.softening);
  }
  if (data.total_steps !== undefined) {
    totalSteps = Number(data.total_steps);
  }

  return { bodies, g, dt, softening, totalSteps };
}

// ─── N-Body Physics (Verlet Integrator) ────────────────────────────────────
function computeAccelerations(bodies, softening, G) {
  const n = bodies.length;
  const accs = bodies.map(() => [0, 0, 0]);
  const soft2 = softening * softening;

  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = bodies[j].pos[0] - bodies[i].pos[0];
      const dy = bodies[j].pos[1] - bodies[i].pos[1];
      const dz = bodies[j].pos[2] - bodies[i].pos[2];
      const dist2 = dx*dx + dy*dy + dz*dz + soft2;
      const dist = Math.sqrt(dist2);
      const dist3 = dist2 * dist;
      const factor = G / dist3;

      const ai = factor * bodies[j].mass;
      accs[i][0] += ai * dx;
      accs[i][1] += ai * dy;
      accs[i][2] += ai * dz;

      const aj = factor * bodies[i].mass;
      accs[j][0] -= aj * dx;
      accs[j][1] -= aj * dy;
      accs[j][2] -= aj * dz;
    }
  }
  return accs;
}

function verletStep(bodies, dt, softening, G) {
  const halfDt = dt / 2;

  let accs = computeAccelerations(bodies, softening, G);
  for (let i = 0; i < bodies.length; i++) {
    bodies[i].vel[0] += accs[i][0] * halfDt;
    bodies[i].vel[1] += accs[i][1] * halfDt;
    bodies[i].vel[2] += accs[i][2] * halfDt;
  }

  for (let i = 0; i < bodies.length; i++) {
    bodies[i].pos[0] += bodies[i].vel[0] * dt;
    bodies[i].pos[1] += bodies[i].vel[1] * dt;
    bodies[i].pos[2] += bodies[i].vel[2] * dt;
  }

  accs = computeAccelerations(bodies, softening, G);

  for (let i = 0; i < bodies.length; i++) {
    bodies[i].vel[0] += accs[i][0] * halfDt;
    bodies[i].vel[1] += accs[i][1] * halfDt;
    bodies[i].vel[2] += accs[i][2] * halfDt;
  }
}

function totalEnergy(bodies, G) {
  let ke = 0, pe = 0;
  for (const b of bodies) {
    ke += 0.5 * b.mass * (b.vel[0]**2 + b.vel[1]**2 + b.vel[2]**2);
  }
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const dx = bodies[j].pos[0] - bodies[i].pos[0];
      const dy = bodies[j].pos[1] - bodies[i].pos[1];
      const dz = bodies[j].pos[2] - bodies[i].pos[2];
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist > 1e-20) pe -= G * bodies[i].mass * bodies[j].mass / dist;
    }
  }
  return ke + pe;
}

// ─── Key material generation (320 bytes = 640 hex chars) ──────────────────
// Matches the Rust extract_seed_extended() which produces 5× SHA3-512 output.
// Uses FNV-1a hash in counter mode to produce 320 bytes of key material.
function hashState(bodies, step) {
  // Build a deterministic string from the orbital state
  let data = '';
  for (const b of bodies) {
    data += b.pos.map(v => v.toFixed(12)).join(',') + '|';
    data += b.vel.map(v => v.toFixed(12)).join(',') + '|';
    data += b.mass.toExponential(6) + '|';
  }
  data += step;

  // FNV-1a hash of the state string
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  // Generate 320 bytes (640 hex chars) using counter mode
  // Each counter value produces 4 bytes (8 hex chars) via FNV-1a
  let key = '';
  for (let counter = 0; counter < 80; counter++) {
    const mix = data + ':' + counter + ':' + step;
    let h = fnv1a(mix);
    // Second pass with body positions for avalanche
    for (const b of bodies) {
      for (const v of [...b.pos, ...b.vel]) {
        h ^= (Math.floor(Math.abs(v * 1e9)) & 0xFFFFFFFF);
        h = Math.imul(h, 0x01000193);
      }
    }
    key += (h >>> 0).toString(16).padStart(8, '0');
  }
  return key.toUpperCase();
}

// ─── Three.js Scene Setup ─────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4, 3, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.08;
orbitControls.minDistance = 0.5;
orbitControls.maxDistance = 30;
orbitControls.autoRotate = false;
orbitControls.autoRotateSpeed = 0.5;

// ─── Lighting ──────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x222244, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
fillLight.position.set(-5, -3, -5);
scene.add(fillLight);
const pointLight = new THREE.PointLight(0xffaa00, 0.5, 10);
pointLight.position.set(0, 0, 0);
scene.add(pointLight);

// ─── Background Stars ──────────────────────────────────────────────────────
const starsGeometry = new THREE.BufferGeometry();
const starCount = 3000;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPositions[i] = (Math.random() - 0.5) * 200;
starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const stars = new THREE.Points(starsGeometry, new THREE.PointsMaterial({
  color: 0xffffff, size: 0.05, transparent: true, opacity: 0.8,
}));
scene.add(stars);

// ─── Grid ──────────────────────────────────────────────────────────────────
const gridHelper = new THREE.GridHelper(8, 20, 0x4488ff, 0x224488);
gridHelper.position.y = -0.5;
scene.add(gridHelper);

// ─── Orbit Rings ──────────────────────────────────────────────────────────
function createOrbitRing(radius, color) {
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const t = (i / 64) * Math.PI * 2;
    pts.push(new THREE.Vector3(radius * Math.cos(t), 0, radius * Math.sin(t)));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.15 })
  );
}
const ring1 = createOrbitRing(1.0, 0x4488ff);
const ring2 = createOrbitRing(2.0, 0x44ff88);
scene.add(ring1);
scene.add(ring2);

// ─── Glow Texture ──────────────────────────────────────────────────────────
const glowCanvas = document.createElement('canvas');
glowCanvas.width = 64; glowCanvas.height = 64;
const gctx = glowCanvas.getContext('2d');
const grad = gctx.createRadialGradient(32, 32, 0, 32, 32, 32);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.2, 'rgba(255,255,255,0.8)');
grad.addColorStop(0.5, 'rgba(255,255,255,0.3)');
grad.addColorStop(1, 'rgba(255,255,255,0)');
gctx.fillStyle = grad;
gctx.fillRect(0, 0, 64, 64);
const glowTexture = new THREE.CanvasTexture(glowCanvas);

// ─── Simulation State ─────────────────────────────────────────────────────
let bodies = [];
let bodyMeshes = [];
let bodyLabels = [];
let trails = [];
let trailGeometries = [];
let step = 0;
let paused = false;
let currentKey = '';
let lastKeyUpdate = 0;
let stepsPerFrame = 1;
let currentG = CONFIG.G;
let currentDt = CONFIG.dt;
let currentSoftening = CONFIG.softening;

// ─── Scene Build / Rebuild ────────────────────────────────────────────────
function clearBodies() {
  for (const m of bodyMeshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  for (const l of bodyLabels) scene.remove(l);
  for (const t of trailGeometries) { scene.remove(t); t.geometry.dispose(); t.material.dispose(); }
  bodyMeshes = [];
  bodyLabels = [];
  trails = [];
  trailGeometries = [];
}

// Compute sphere size from mass using a logarithmic scale.
// Sun (mass=1.0) → 0.15, planet (mass=1e-6) → ~0.04, smaller planets scale down.
function massToSize(mass) {
  if (mass >= 1.0) return 0.15; // Sun
  // Log scale: size = 0.02 + 0.13 * (log10(mass) + 6) / 6
  // mass=1e-6 → 0.04, mass=5e-7 → 0.035, mass=2e-7 → 0.027
  const logMass = Math.log10(mass);
  const t = (logMass + 6) / 6; // Normalize: 1e-6 → 0, 1 → 1
  return 0.02 + 0.13 * Math.max(0, Math.min(1, t));
}

function buildBodies(newBodies) {
  clearBodies();
  bodies = newBodies;
  step = 0;
  currentKey = '';
  document.getElementById('key-material').textContent = 'Waiting for key generation...';

  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];

    // Compute size from mass (or use provided size as override)
    const size = b.size !== undefined ? b.size : massToSize(b.mass);
    // Store computed size for use in animation loop
    b._size = size;

    // Sphere
    const geo = new THREE.SphereGeometry(size, 32, 32);
    const mat = new THREE.MeshStandardMaterial({
      color: b.color, emissive: b.color, emissiveIntensity: 0.3,
      metalness: 0.1, roughness: 0.4,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(b.pos[0], b.pos[1], b.pos[2]);
    mesh.castShadow = true;
    scene.add(mesh);
    bodyMeshes.push(mesh);

    // Glow
    const spriteMat = new THREE.SpriteMaterial({
      map: glowTexture, blending: THREE.AdditiveBlending,
      transparent: true, opacity: 0.6, color: b.color,
    });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.scale.set(size * 6, size * 6, 1);
    mesh.add(sprite);

    // Label
    const div = document.createElement('div');
    div.textContent = b.name;
    div.style.cssText = 'color:#fff;font-size:12px;font-family:monospace;text-shadow:0 0 8px rgba(0,0,0,0.8);background:rgba(0,0,0,0.5);padding:2px 8px;border-radius:4px;border:1px solid ' + new THREE.Color(b.color).getStyle() + ';pointer-events:none;';
    const label = new CSS2DObject(div);
    label.position.set(b.pos[0], b.pos[1] + size + 0.08, b.pos[2]);
    scene.add(label);
    bodyLabels.push(label);

    // Trail
    const trailPos = new Float32Array(CONFIG.trailLength * 3);
    const trailGeo = new THREE.BufferGeometry();
    trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
    trailGeo.setDrawRange(0, 0);
    const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
      color: b.color, transparent: true, opacity: 0.4,
    }));
    scene.add(trailLine);
    trails.push([]);
    trailGeometries.push(trailLine);
  }

  // Update UI
  document.getElementById('bodies-display').textContent = bodies.length;
  document.getElementById('g-display').textContent = currentG.toFixed(3);
  document.getElementById('step-display').textContent = '0';
  document.getElementById('energy-display').textContent = '0.000';
  document.getElementById('status-dot').className = 'stable';
  document.getElementById('status-text').textContent = 'SIMULATING';
}

// ─── Initialize with defaults ─────────────────────────────────────────────
buildBodies(createDefaultBodies());

// ─── UI Elements ──────────────────────────────────────────────────────────
const stepDisplay = document.getElementById('step-display');
const bodiesDisplay = document.getElementById('bodies-display');
const gDisplay = document.getElementById('g-display');
const energyDisplay = document.getElementById('energy-display');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const keyMaterial = document.getElementById('key-material');
const speedSlider = document.getElementById('speed-slider');
const speedValue = document.getElementById('speed-value');
const fileName = document.getElementById('file-name');
const jsonFileInput = document.getElementById('json-file');
const resetBtn = document.getElementById('reset-btn');

// ─── Speed Slider ─────────────────────────────────────────────────────────
speedSlider.addEventListener('input', () => {
  const idx = parseInt(speedSlider.value);
  stepsPerFrame = SPEED_PRESETS[idx][1];
  speedValue.textContent = stepsPerFrame;
});
speedValue.textContent = stepsPerFrame;

// ─── JSON File Loader ─────────────────────────────────────────────────────
jsonFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  fileName.textContent = `📄 ${file.name}`;

  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const result = parseOrbitalConfig(evt.target.result);
      currentG = result.g;
      currentDt = result.dt;
      currentSoftening = result.softening;

      // Auto-adjust camera if many bodies
      const maxR = Math.max(...result.bodies.map(b => Math.sqrt(b.pos[0]**2 + b.pos[1]**2 + b.pos[2]**2)));
      if (maxR > 3) {
        camera.position.set(maxR * 1.5, maxR * 1.2, maxR * 2);
        orbitControls.target.set(0, 0, 0);
        orbitControls.update();
      }

      buildBodies(result.bodies);
      statusDot.className = 'stable';
      statusText.textContent = 'LOADED ✓';
      setTimeout(() => { if (!paused) { statusText.textContent = 'SIMULATING'; } }, 1500);
    } catch (err) {
      fileName.textContent = `❌ Error: ${err.message}`;
      console.error('Failed to parse JSON:', err);
    }
  };
  reader.readAsText(file);
});

// ─── Reset Button ─────────────────────────────────────────────────────────
resetBtn.addEventListener('click', () => {
  currentG = CONFIG.G;
  currentDt = CONFIG.dt;
  currentSoftening = CONFIG.softening;
  jsonFileInput.value = '';
  fileName.textContent = 'Default 9-body system';
  buildBodies(createDefaultBodies());
  paused = false;
  statusDot.className = 'stable';
  statusText.textContent = 'SIMULATING';
});

// ─── Click to pause ────────────────────────────────────────────────────────
renderer.domElement.addEventListener('click', () => {
  paused = !paused;
  statusText.textContent = paused ? 'PAUSED' : 'SIMULATING';
  statusDot.className = paused ? 'warning' : 'stable';
});

// ─── Animation Loop ────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  if (!paused && bodies.length > 0) {
    for (let s = 0; s < stepsPerFrame; s++) {
      verletStep(bodies, currentDt, currentSoftening, currentG);
      step++;

      // Generate key material on every step (stored for later use)
      currentKey = hashState(bodies, step);
    }

    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      bodyMeshes[i].position.set(b.pos[0], b.pos[1], b.pos[2]);
      bodyLabels[i].position.set(b.pos[0], b.pos[1] + (b._size || 0.04) + 0.08, b.pos[2]);

      trails[i].push([b.pos[0], b.pos[1], b.pos[2]]);
      if (trails[i].length > CONFIG.trailLength) trails[i].shift();

      const arr = trailGeometries[i].geometry.attributes.position.array;
      const cnt = trails[i].length;
      for (let t = 0; t < cnt; t++) {
        arr[t*3] = trails[i][t][0];
        arr[t*3+1] = trails[i][t][1];
        arr[t*3+2] = trails[i][t][2];
      }
      trailGeometries[i].geometry.attributes.position.needsUpdate = true;
      trailGeometries[i].geometry.setDrawRange(0, cnt);
    }

    stepDisplay.textContent = step.toLocaleString();
    energyDisplay.textContent = totalEnergy(bodies, currentG).toFixed(6);

    // Update key material display every 1 second (throttled)
    const now = Date.now();
    if (now - lastKeyUpdate >= 1000) {
      lastKeyUpdate = now;
      keyMaterial.textContent = currentKey.slice(0, 128);
    }

    // ─── Stability Monitoring ──────────────────────────────────────────
    // Collapse detection (checked first — higher priority)
    let collapsed = false;
    let collapsePair = '';
    for (let i = 0; i < bodies.length && !collapsed; i++) {
      for (let j = i + 1; j < bodies.length && !collapsed; j++) {
        const dx = bodies[j].pos[0] - bodies[i].pos[0];
        const dy = bodies[j].pos[1] - bodies[i].pos[1];
        const dz = bodies[j].pos[2] - bodies[i].pos[2];
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist < CONFIG.collapseThreshold) {
          collapsed = true;
          collapsePair = `${bodies[i].name} + ${bodies[j].name}`;
          bodyMeshes[i].material.emissive.setHex(0xff0000);
          bodyMeshes[i].material.emissiveIntensity = 1.0;
          bodyMeshes[j].material.emissive.setHex(0xff0000);
          bodyMeshes[j].material.emissiveIntensity = 1.0;
        }
      }
    }

    // Ejection detection (only if no collapse)
    let ejected = false;
    if (!collapsed) {
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        const v2 = b.vel[0]**2 + b.vel[1]**2 + b.vel[2]**2;
        let ke = 0.5 * b.mass * v2;
        let pe = 0;
        for (let j = 0; j < bodies.length; j++) {
          if (i === j) continue;
          const dx = bodies[j].pos[0] - b.pos[0];
          const dy = bodies[j].pos[1] - b.pos[1];
          const dz = bodies[j].pos[2] - b.pos[2];
          const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
          if (dist > 1e-20) {
            pe -= currentG * b.mass * bodies[j].mass / dist;
          }
        }
        if (ke + pe >= 0) {
          ejected = true;
          bodyMeshes[i].material.emissive.setHex(0xff0000);
          bodyMeshes[i].material.emissiveIntensity = 1.0;
        } else {
          bodyMeshes[i].material.emissive.setHex(bodies[i].color);
          bodyMeshes[i].material.emissiveIntensity = 0.3;
        }
      }
    }

    if (collapsed) {
      statusDot.className = 'error';
      statusText.textContent = `⚠ COLLAPSE: ${collapsePair}`;
    } else if (ejected) {
      statusDot.className = 'error';
      statusText.textContent = '⚠ EJECTION DETECTED';
    }
  }

  orbitControls.update();

  // Auto-rotate when not interacting
  if (!orbitControls.isDragging && !paused) {
    const time = Date.now() * 0.0001;
    stars.rotation.y = time * 0.01;
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

animate();

// ─── Resize Handler ────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Keyboard Controls ─────────────────────────────────────────────────────
window.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'p') {
    e.preventDefault();
    paused = !paused;
    statusText.textContent = paused ? 'PAUSED' : 'SIMULATING';
    statusDot.className = paused ? 'warning' : 'stable';
  }
  if (e.key === 'r' || e.key === 'R') {
    resetBtn.click();
  }
});

console.log('🚀 Kelvin Orbital Key Generator — 3D Visualization');
console.log('Controls: [Space/P] Pause  [R] Reset  [Mouse] Orbit');
console.log('Load a key.json file to configure custom initial conditions.');
</script>
