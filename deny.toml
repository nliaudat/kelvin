# cargo-deny configuration for Kelvin cryptosystem
#
# Schema for cargo-deny >= 0.16: vulnerabilities are always an error, so the
# obsolete `vulnerability`/`notice` keys are gone; licenses use an allow-list
# (anything not allowed is denied), so the explicit `deny` list is unnecessary.

[advisories]
# cargo-deny expects one of all|workspace|transitive|none.
unmaintained = "all"
yanked = "warn"
ignore = [
    # No fixed upgrade exists. All four reach the build only through
    # benchmark/test tooling, never through kelvin-core or kelvin at runtime.
    "RUSTSEC-2021-0139", # ansi_term: unmaintained, via dudect-bencher (bench)
    "RUSTSEC-2024-0375", # atty: unmaintained, via dudect-bencher (bench)
    "RUSTSEC-2024-0436", # paste: unmaintained, via nistrs->nalgebra (test crate)
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8