[package]
name = "kelvin-kdf"
version = "0.1.0"
edition = "2021"
description = "Key derivation layer for Kelvin cryptosystem"
license = "CC-BY-NC-SA-4.0"

[lib]
name = "kelvin_kdf"
path = "src/lib.rs"

[dependencies]
kelvin-core = { path = "../kelvin-core" }
sha3 = { version = "0.10", default-features = false }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
thiserror = "1.0"
zeroize = { version = "1.6", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "kelvin-core/serde"]
