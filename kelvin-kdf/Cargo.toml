[package]
name = "kelvin-kdf"
version = "0.1.0"
edition = "2021"
description = "Key derivation layer for Kelvin cryptosystem"
license = "CC-BY-NC-SA-4.0"

[lib]
name = "kelvin_kdf"
path = "src/lib.rs"

[dependencies]
kelvin-core = { path = "../kelvin-core" }
sha3 = { version = "0.10", default-features = false }
hkdf = "0.12"
blake3 = "1.5"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
signature = "2.2"
thiserror = "1.0"
zeroize = { version = "1.6", features = ["zeroize_derive"] }
ml-kem = { version = "0.3", default-features = false, features = ["alloc"] }
ml-dsa = { version = "0.1.0-rc.4", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[[test]]
name = "chaos_test"
path = "../tests/kelvin_tests/chaos_test.rs"

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "kelvin-core/serde"]
