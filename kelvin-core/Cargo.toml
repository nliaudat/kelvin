[package]
name = "kelvin-core"
version = "0.1.0"
edition = "2021"
description = "Fixed-point math and n-body simulation engine for Kelvin cryptosystem"
license = "MIT OR Apache-2.0"

[lib]
name = "kelvin_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
zeroize = { version = "1.6", features = ["zeroize_derive"], optional = true }
fail = { version = "0.5", optional = true }
subtle = { version = "2.5", optional = true, default-features = false }

[dev-dependencies]
sha3 = { version = "0.10", default-features = false }
hex = "0.4"

[[test]]
name = "determinism"
path = "../tests/kelvin_tests/determinism.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = ["zeroize"]
serde = ["dep:serde", "dep:serde_json"]
zeroize = ["dep:zeroize"]
failpoints = ["dep:fail"]
subtle-ct = ["dep:subtle"]
