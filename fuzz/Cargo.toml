[package]
name = "kelvin-fuzz"
version = "0.1.0"
edition = "2021"
description = "Property-based fuzz tests for Kelvin cryptosystem deserialization"
license = "MIT OR Apache-2.0"

[dependencies]
kelvin = { path = "../kelvin" }
kelvin-core = { path = "../kelvin-core" }
kelvin-kdf = { path = "../kelvin-kdf", features = ["serde"] }

# Override blake3 to use pure Rust implementation (avoids C compiler dependency on Windows GNU)
blake3 = { version = "1.5", default-features = false, features = ["pure"] }

[dev-dependencies]
proptest = "1.4"

[[test]]
name = "deserialize_config"
path = "fuzz_targets/deserialize_config.rs"
harness = true

[[test]]
name = "simulate_state"
path = "fuzz_targets/simulate_state.rs"
harness = true

[[test]]
name = "api_encrypt"
path = "fuzz_targets/api_encrypt.rs"
harness = true

[[test]]
name = "differential_accel"
path = "fuzz_targets/differential_accel.rs"
harness = true
