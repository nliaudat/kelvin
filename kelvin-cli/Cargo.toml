[package]
name = "kelvin-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Kelvin cryptosystem"
license = "MIT OR Apache-2.0"

[[bin]]
name = "kelvin"
path = "src/main.rs"

[dependencies]
kelvin = { path = "../kelvin", features = ["serde"] }
clap = { version = "4.0", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde_json = "1.0"
anyhow = "1.0"
rand = "0.8"
hex = "0.4"
ml-kem = "0.3"
ml-dsa = "0.0"
