[package]
name = "information_loss"
version = "0.1.0"
edition = "2021"
description = "Empirical validation of C1: fixed-point information loss analysis for the Kelvin n-body simulation"

[dependencies]
kelvin = { path = "../../kelvin" }
kelvin-core = { path = "../../kelvin-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
disallowed_methods = "allow"
unnecessary_cast = "allow"